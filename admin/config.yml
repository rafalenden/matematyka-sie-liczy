# Sveltia CMS – https://sveltiacms.app
backend:
  name: github
  repo: rafenden/matematyka-sie-liczy
  branch: main
  auth_methods: [token] # fine-grained GitHub token with "Contents: read and write"

site_url: https://matematykasieliczy.pl
logo_url: /images/logo.svg
media_folder: images
public_folder: /images
locale: pl

collections:
  - name: pages
    label: Strony
    files:
      - name: home
        label: Strona główna
        file: src/index.md
        format: frontmatter
        fields:
          - { name: layout, widget: hidden, default: layout.njk }
          - { name: title, label: Tytuł, widget: string }
          - { name: intro, label: Podtytuł, widget: string }
          - name: contact
            label: Kontakt
            widget: object
            hint: Na stronie e-mail i telefon są ukryte przed botami i pokazują się po kliknięciu.
            fields:
              - { name: email, label: E-mail, widget: string, required: false }
              - { name: phone, label: Telefon, widget: string, required: false }
          - name: body
            label: Treść
            widget: markdown
            hint: Cennik, opinie i przycisk wstawisz z menu „Wstaw” (+).
            editor_components: [pricing, testimonials, button, table, image]
          - { name: footer, label: Stopka, widget: string, required: false, hint: "{rok} zamienia się na bieżący rok." }
